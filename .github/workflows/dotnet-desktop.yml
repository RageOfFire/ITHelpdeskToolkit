name: Build ITHelpdeskToolkit

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained (multi-file, bundles .NET 8 runtime)
        run: >
          dotnet publish ITHelpdeskToolkit.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ITHelpdeskToolkit-win-x64
          path: publish/
